<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gezinsbord</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: kiosk-scherm — kopbalk met gezinsleden, één groot kalendervlak, dagpanelen eronder, assistent als overlay */
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --line: #e1e6ee;
  --fg: #1f2733;
  --muted: #6b7686;
  --accent: #2bb3a8;
  --accent-ink: #0d5f59;
  --now: #d9534f;
  --ink-on-color: #ffffff;
  --shadow: 0 8px 28px rgba(31, 39, 51, .10);
  --glow-a: #ff8a4c;
  --glow-b: #48d1c4;
  --glow-c: #6d7cff;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  --hour: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161d; --surface: #1a212b; --surface-2: #212a36; --line: #2d3746;
    --fg: #e8edf3; --muted: #95a1b2; --accent: #4fd1c5; --accent-ink: #b8f3ed;
    --now: #ff6b66; --shadow: 0 8px 28px rgba(0,0,0,.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161d; --surface: #1a212b; --surface-2: #212a36; --line: #2d3746;
  --fg: #e8edf3; --muted: #95a1b2; --accent: #4fd1c5; --accent-ink: #b8f3ed;
  --now: #ff6b66; --shadow: 0 8px 28px rgba(0,0,0,.45); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app {
  height: 100%; display: flex; flex-direction: column; gap: 12px;
  padding-block: 14px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* Kopbalk */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.clock { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.1; }
.tabs { display: flex; gap: 4px; background: var(--surface); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
.tabs button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.nav { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; }
.range { font-weight: 600; min-width: 9ch; text-align: center; font-variant-numeric: tabular-nums; }
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; width: 34px; height: 30px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.today-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; }
/* Gezinsleden */
.people { display: flex; gap: 14px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
.person { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; padding: 0; min-width: 64px; }
.avatar { width: 48px; height: 48px; border-radius: 46% 54% 50% 50% / 55% 45% 55% 45%; display: grid; place-items: center; font-size: 22px; position: relative; background: var(--c); color: var(--ink-on-color); font-weight: 700; transition: transform .2s, opacity .2s; }
.avatar::after { content: ""; position: absolute; right: -2px; bottom: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 2px solid var(--bg); filter: saturate(1.4) brightness(.85); }
.person span { font-size: 13px; font-weight: 600; }
.person[aria-pressed="false"] .avatar { opacity: .3; transform: scale(.9); }
.person[aria-pressed="false"] span { color: var(--muted); }
.count-chip { align-self: center; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; white-space: nowrap; }
/* Hoofdvlak */
.main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.board { flex: 1; min-height: 0; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow: auto; }
/* Dagweergave */
.day-grid { display: grid; grid-template-columns: 58px repeat(var(--cols), minmax(120px, 1fr)); min-width: calc(58px + var(--cols) * 120px); }
.allday { display: contents; }
.allday .lbl { font-size: 11px; color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--line); position: sticky; left: 0; background: var(--surface); }
.allday .cell { border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); padding: 4px; display: flex; flex-direction: column; gap: 3px; min-height: 30px; }
.hours { position: relative; }
.hour-lbl { height: var(--hour); font-size: 11px; color: var(--muted); text-align: right; padding-right: 8px; transform: translateY(-7px); font-variant-numeric: tabular-nums; }
.col { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--hour)); }
.ev { position: absolute; left: 4px; right: 4px; border-radius: 8px; padding: 4px 7px; background: var(--c); color: var(--ink-on-color); font-size: 12px; overflow: hidden; border: 0; text-align: left; line-height: 1.25; }
.ev b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev small { opacity: .9; font-variant-numeric: tabular-nums; }
.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--now); z-index: 3; pointer-events: none; }
.nowtag { position: absolute; left: 2px; z-index: 4; background: var(--now); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 5px; transform: translateY(-50%); font-variant-numeric: tabular-nums; }
/* Week */
.week { display: grid; grid-template-columns: repeat(7, minmax(130px, 1fr)); min-width: 910px; min-height: 100%; }
.wday { border-left: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; }
.wday:first-child { border-left: 0; }
.wday-h { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
.wday-h strong { font-family: var(--f-display); font-weight: 400; font-size: 17px; }
.wday-h .n { font-size: 11px; color: var(--muted); }
.is-today .datebadge { background: var(--fg); color: var(--bg); border-radius: 6px; padding: 0 5px; }
.chip { border: 0; text-align: left; border-radius: 9px; padding: 6px 8px; background: var(--c); color: var(--ink-on-color); font-size: 12.5px; line-height: 1.25; width: 100%; }
.chip b { display: block; font-weight: 600; }
.chip small { font-size: 11px; opacity: .92; font-variant-numeric: tabular-nums; }
.chip.multi { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.chip.multi small { color: var(--muted); opacity: 1; }
.dots { display: flex; gap: 3px; margin-top: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: block; }
.empty-note { font-family: var(--f-display); color: var(--muted); font-size: 13px; text-align: center; margin-top: 18px; line-height: 1.4; }
/* Maand */
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: minmax(92px, 1fr); min-height: 100%; }
.mhead { font-size: 12px; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); }
.mcell { border-left: 1px solid var(--line); border-top: 1px solid var(--line); padding: 5px; display: flex; flex-direction: column; gap: 3px; min-width: 0; background: none; border-right: 0; border-bottom: 0; text-align: left; }
.mcell:nth-child(7n+1) { border-left: 0; }
.mcell.out { opacity: .4; }
.mnum { font-size: 12px; display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.mnum .c { color: var(--muted); font-size: 11px; }
.mchip { font-size: 11px; border-radius: 5px; padding: 2px 5px; background: var(--c); color: var(--ink-on-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mchip.multi { background: none; color: var(--fg); padding-left: 0; }
.more { font-size: 11px; color: var(--muted); }
/* Dagpanelen */
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-height: 38%; min-height: 0; }
.panel { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: auto; min-width: 0; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
.panel h2 button { border: 0; background: none; color: var(--accent-ink); font-size: 13px; font-family: var(--f-body); font-weight: 600; }
.meal { display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.meal:last-child { border-bottom: 0; }
.meal .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.trow { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 12px; background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.trow .who { font-weight: 600; color: var(--c); font-size: 13px; line-height: 1.2; }
.trow .who small { display: block; color: var(--muted); font-weight: 500; font-size: 11px; font-variant-numeric: tabular-nums; }
.ticons { display: flex; flex-wrap: wrap; gap: 6px; }
.tico { width: 36px; height: 36px; border-radius: 10px; border: 2px solid var(--c); background: var(--surface); font-size: 17px; display: grid; place-items: center; position: relative; }
.tico[aria-pressed="true"] { background: var(--c); }
.tico[aria-pressed="true"]::after { content: "✓"; position: absolute; right: -5px; top: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: 10px; display: grid; place-items: center; font-weight: 700; }
/* Takenpagina & maaltijden */
.page { padding: 18px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); align-content: start; }
.card { border-radius: 18px; padding: 14px; background: color-mix(in srgb, var(--c, var(--accent)) 9%, var(--surface)); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h3 { margin: 0; display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 400; font-size: 18px; }
.card h3 .avatar { width: 34px; height: 34px; font-size: 16px; }
.card h3 .avatar::after { display: none; }
.bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 999px; transition: width .3s; }
.task { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; }
.task .tico { width: 30px; height: 30px; font-size: 15px; flex: none; }
.task.done span { text-decoration: line-through; color: var(--muted); }
.task .x { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 18px; padding: 0 4px; }
.addrow { display: flex; gap: 6px; }
.addrow input { flex: 1; min-width: 0; }
.mealday { background: var(--surface); }
.mealday h3 { font-size: 17px; }
.mealday.today { box-shadow: inset 0 0 0 2px var(--accent); }
.mealday label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
input, select, textarea { font: inherit; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; }
/* Zwevende knoppen */
.fab { position: fixed; right: max(22px, calc(env(safe-area-inset-right, 0px) + 22px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--fg); color: var(--bg); font-size: 30px; box-shadow: var(--shadow); z-index: 20; }
.mascot-btn { position: fixed; left: max(22px, calc(env(safe-area-inset-left, 0px) + 22px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); border: 0; background: none; padding: 0; z-index: 20; }
.mascot { width: 62px; height: 62px; border-radius: 52% 48% 46% 54% / 58% 52% 48% 42%; background: radial-gradient(circle at 35% 30%, #c9fff8, var(--glow-b) 60%, #2a9d94); position: relative; box-shadow: 0 6px 20px color-mix(in srgb, var(--glow-b) 50%, transparent); animation: bob 4s ease-in-out infinite; }
.mascot::before, .mascot::after { content: ""; position: absolute; top: 42%; width: 6px; height: 9px; border-radius: 50%; background: #1a3b3a; }
.mascot::before { left: 38%; } .mascot::after { left: 56%; }
.mascot.listening { animation: pulse 1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px) rotate(-3deg); } }
@keyframes pulse { 50% { transform: scale(1.1); } }
/* Assistent */
.assist { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; padding-block: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-bottom, 0px) + 18px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(120% 60% at 100% 0%, color-mix(in srgb, var(--glow-a) 70%, transparent), transparent 60%),
    radial-gradient(80% 50% at 0% 100%, color-mix(in srgb, var(--glow-c) 55%, transparent), transparent 60%),
    radial-gradient(90% 60% at 50% 100%, color-mix(in srgb, var(--glow-b) 60%, transparent), transparent 70%),
    color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
.assist-inner { width: 100%; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; height: 100%; min-height: 0; }
.assist-top { display: flex; align-items: flex-start; gap: 12px; }
.assist-top .mascot { width: 54px; height: 54px; flex: none; animation: bob 4s ease-in-out infinite; }
.assist-close { margin-left: auto; width: 42px; height: 42px; border-radius: 12px; border: 0; background: color-mix(in srgb, var(--surface) 55%, transparent); font-size: 22px; flex: none; }
.bubble { background: var(--surface); border-radius: 20px; padding: 12px 16px; box-shadow: var(--shadow); max-width: 640px; line-height: 1.45; min-width: 0; }
.bubble.me { align-self: flex-end; background: var(--accent); color: #06302d; font-weight: 500; }
.bubble ul, .bubble ol { margin: 6px 0 0; padding-left: 20px; }
.convo { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px; }
.added { background: var(--surface); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); max-width: 640px; }
.added h4 { margin: 0 0 8px; font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.added .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 8px 12px; }
.added .row small { color: var(--muted); display: block; font-variant-numeric: tabular-nums; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; }
.suggest button { border: 0; background: var(--surface); border-radius: 999px; padding: 9px 14px; box-shadow: var(--shadow); font-size: 14px; }
.composer { display: flex; gap: 8px; align-items: center; background: var(--surface); border-radius: 999px; padding: 6px 6px 6px 16px; box-shadow: var(--shadow); }
.composer input { border: 0; background: none; padding: 8px 0; }
.composer input:focus-visible { outline: none; }
.talk { border: 0; border-radius: 999px; background: var(--fg); color: var(--bg); padding: 10px 16px; font-weight: 700; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.talk.on { background: var(--now); color: #fff; }
.disclaimer { text-align: center; font-size: 11px; color: var(--fg); opacity: .7; }
/* Dialoog */
.modal-back { position: fixed; inset: 0; background: rgba(15, 20, 28, .4); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); width: min(520px, 100%); max-height: 90%; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.modal h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.modal h3 button { border: 0; background: none; font-size: 22px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { border: 2px solid var(--c); background: none; border-radius: 999px; padding: 6px 12px; font-weight: 600; }
.pick[aria-pressed="true"] { background: var(--c); color: var(--ink-on-color); }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: auto; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; background: var(--fg); color: var(--bg); }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.danger { background: none; color: var(--now); margin-right: auto; }
.list-ev { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; border: 0; width: 100%; text-align: left; }
.list-ev small { color: var(--muted); display: block; font-variant-numeric: tabular-nums; }
.member-edit { display: grid; grid-template-columns: 60px 1fr 54px 36px; gap: 8px; align-items: center; }
.member-edit input[type="color"] { padding: 2px; height: 40px; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.45; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; z-index: 80; font-weight: 600; box-shadow: var(--shadow); }
@media (max-width: 760px) {
  .panels { grid-template-columns: 1fr; max-height: 45%; }
  .brand h1 { font-size: 22px; }
  .nav { margin-left: 0; width: 100%; }
  .range { flex: 1; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="clock" id="clock"></span><h1 id="title">Kalender</h1></div>
    <nav class="tabs" aria-label="Onderdelen">
      <button data-tab="cal" aria-pressed="true">Kalender</button>
      <button data-tab="tasks" aria-pressed="false">Taken</button>
      <button data-tab="meals" aria-pressed="false">Maaltijden</button>
    </nav>
    <div class="nav" id="calnav">
      <button class="iconbtn" id="prev" aria-label="Vorige"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="range" id="range"></span>
      <button class="iconbtn" id="next" aria-label="Volgende"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="today-btn" id="todayBtn">Vandaag</button>
      <div class="seg" role="group" aria-label="Weergave">
        <button data-view="D" title="Dag">D</button><button data-view="W" title="Week">W</button><button data-view="M" title="Maand">M</button>
      </div>
      <button class="iconbtn" id="settingsBtn" aria-label="Instellingen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>
  <div class="people" id="people"></div>
  <main class="main" id="main"></main>
</div>
<button class="mascot-btn" id="mascotBtn" aria-label="Assistent openen"><div class="mascot" id="mascot"></div></button>
<button class="fab" id="fab" aria-label="Afspraak toevoegen">+</button>
<div id="layer"></div>

<script>
(() => {
'use strict';
const KEY = 'gezinsbord.v1';
const DAYS = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const DSHORT = ['zo','ma','di','wo','do','vr','za'];
const MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const MSHORT = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const HSTART = 6, HEND = 24;

// ---------- datums ----------
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => addDays(d, -((d.getDay() + 6) % 7));
const toMin = t => { const [h, m] = (t || '0:0').split(':').map(Number); return h * 60 + m; };
const fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':'); return m === '00' ? `${+h}u` : `${+h}:${m}`; };
const fmtRange = e => e.allDay ? 'Hele dag' : `${fmtTime(e.start)} – ${fmtTime(e.end)}`;
const longDate = d => `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- opslag ----------
function seed() {
  const t = new Date(); const T = iso(t);
  const wk = startOfWeek(t);
  const day = n => iso(addDays(wk, n));
  const members = [
    { id: 'm1', name: 'Papa', emoji: '🧔', color: '#4a7bd8' },
    { id: 'm2', name: 'Mama', emoji: '👩', color: '#d9576b' },
    { id: 'm3', name: 'Noah', emoji: '🧒', color: '#5aa864' },
    { id: 'm4', name: 'Lina', emoji: '👧', color: '#8a62d1' },
    { id: 'm5', name: 'Adam', emoji: '👶', color: '#e08a3c' },
  ];
  const all = members.map(m => m.id);
  const ev = (title, date, start, end, mem, extra = {}) => ({ id: uid(), title, date, start, end, allDay: false, members: mem, repeat: 'none', ...extra });
  const events = [
    ev('Papa – werk', day(0), '07:00', '16:00', ['m1'], { repeat: 'weekly' }),
    ev('Papa – werk', day(1), '07:00', '16:00', ['m1'], { repeat: 'weekly' }),
    ev('Papa – werk', day(2), '07:00', '16:00', ['m1'], { repeat: 'weekly' }),
    ev('Mama – werk', day(0), '08:30', '15:30', ['m2'], { repeat: 'weekly' }),
    ev('Mama – werk', day(3), '08:30', '15:30', ['m2'], { repeat: 'weekly' }),
    ev('Voetbal Noah', day(2), '16:00', '17:30', ['m3'], { repeat: 'weekly' }),
    ev('Zwemles Lina', day(1), '17:00', '18:00', ['m4'], { repeat: 'weekly' }),
    ev('Dans Lina', day(3), '16:30', '17:30', ['m4'], { repeat: 'weekly' }),
    ev('Opvang ophalen', day(4), '15:30', '16:00', ['m2', 'm5']),
    ev('Gezinsavond: spelletjes', day(4), '19:00', '20:00', all),
    ev('Tandarts Adam', day(5), '10:00', '10:30', ['m5', 'm1']),
    ev('Brunch bij oma', day(6), '11:00', '13:00', all),
    ev('Verjaardag oma', day(9), '', '', all, { allDay: true }),
    ev('Ouderavond school', day(8), '19:30', '21:00', ['m1', 'm2']),
    ev('Avondeten samen', T, '18:30', '19:30', all),
  ];
  const ch = (memberId, title, icon) => ({ id: uid(), memberId, title, icon });
  const chores = [
    ch('m1', 'Vuilnis buiten', '🗑️'), ch('m1', 'Afwas', '🍽️'), ch('m1', 'Boodschappen', '🛒'),
    ch('m2', 'Was draaien', '🧺'), ch('m2', 'Planten water', '🪴'), ch('m2', 'Lunchbox klaar', '🥪'),
    ch('m3', 'Bed opmaken', '🛏️'), ch('m3', 'Huiswerk', '📚'), ch('m3', 'Hond uitlaten', '🐕'),
    ch('m4', 'Tanden poetsen', '🪥'), ch('m4', 'Speelgoed opruimen', '🧸'), ch('m4', 'Tafel dekken', '🍴'),
    ch('m5', 'Schoenen weg', '👟'), ch('m5', 'Tanden poetsen', '🪥'),
  ];
  const meals = {
    1: { ontbijt: 'Yoghurt met fruit', lunch: 'Boterhammen', diner: 'Spaghetti bolognese' },
    2: { ontbijt: 'Havermout', lunch: 'Tomatensoep', diner: 'Kip met rijst en groenten' },
    3: { ontbijt: 'Pannenkoekjes', lunch: 'Wraps', diner: 'Vispakketjes met puree' },
    4: { ontbijt: 'Muesli', lunch: 'Pasta salade', diner: 'Linzensoep met brood' },
    5: { ontbijt: 'Eitjes met toast', lunch: 'Boterhammen', diner: 'Zelfgemaakte pizza' },
    6: { ontbijt: 'Croissants', lunch: 'Restjes', diner: 'Gegrilde kebab met salade' },
    0: { ontbijt: 'Brunch bij oma', lunch: '', diner: 'Groentesoep en tosti' },
  };
  const done = {}; done[`${T}|${chores[0].id}`] = true; done[`${T}|${chores[6].id}`] = true; done[`${T}|${chores[9].id}`] = true;
  return { members, events, chores, meals, done, settings: { view: 'W', apiKey: '', model: 'claude-sonnet-5-5', speak: true }, sample: true };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch { S = seed(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

// ---------- UI-status ----------
let cursor = new Date(); cursor.setHours(0, 0, 0, 0);
let tab = 'cal';
const hidden = new Set();
const $ = s => document.querySelector(s);
const member = id => S.members.find(m => m.id === id);
const colorOf = e => (e.members.length === 1 && member(e.members[0])) ? member(e.members[0]).color : (member(e.members[0])?.color || '#7a8594');

function eventsOn(ds, { filter = true } = {}) {
  const wd = parseIso(ds).getDay();
  return S.events.filter(e => {
    const hit = e.date === ds || (e.repeat === 'weekly' && e.date <= ds && parseIso(e.date).getDay() === wd && !(e.skip || []).includes(ds));
    if (!hit) return false;
    if (!filter || !e.members.length) return true;
    return e.members.some(id => !hidden.has(id));
  }).sort((a, b) => (b.allDay - a.allDay) || toMin(a.start) - toMin(b.start));
}

// ---------- render ----------
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === tab)));
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === S.settings.view)));
  $('#calnav').querySelectorAll('#prev,#next,#range,#todayBtn,.seg').forEach(el => el.hidden = tab !== 'cal');
  $('#title').textContent = { cal: 'Kalender', tasks: 'Taken', meals: 'Maaltijden' }[tab];
  $('#fab').hidden = tab !== 'cal';
  renderPeople();
  if (tab === 'cal') renderCal(); else if (tab === 'tasks') renderTasksPage(); else renderMealsPage();
}

function renderPeople() {
  const el = $('#people');
  const n = eventsOn(iso(new Date()), { filter: false }).length;
  el.innerHTML = `<span class="count-chip" title="Afspraken vandaag">${n} vandaag</span>` + S.members.map(m =>
    `<button class="person" data-mid="${m.id}" aria-pressed="${!hidden.has(m.id)}" style="--c:${m.color}"><div class="avatar">${esc(m.emoji || m.name[0])}</div><span>${esc(m.name)}</span></button>`).join('');
}

function renderCal() {
  const v = S.settings.view; const main = $('#main');
  if (v === 'D') {
    $('#range').textContent = `${DSHORT[cursor.getDay()]} ${cursor.getDate()} ${MSHORT[cursor.getMonth()]}`;
    main.innerHTML = `<section class="board"><div class="scroll" id="sc">${dayHTML()}</div></section>${panelsHTML(iso(cursor))}`;
    const sc = $('#sc'); const now = new Date();
    sc.scrollTop = Math.max(0, ((iso(cursor) === iso(now) ? now.getHours() - 1 : 8) - HSTART) * 56);
  } else if (v === 'W') {
    const ws = startOfWeek(cursor), we = addDays(ws, 6);
    $('#range').textContent = ws.getMonth() === we.getMonth() ? `${ws.getDate()}–${we.getDate()} ${MSHORT[we.getMonth()]}` : `${ws.getDate()} ${MSHORT[ws.getMonth()]} – ${we.getDate()} ${MSHORT[we.getMonth()]}`;
    main.innerHTML = `<section class="board"><div class="scroll">${weekHTML(ws)}</div></section>`;
  } else {
    $('#range').textContent = `${MONTHS[cursor.getMonth()]} ${cursor.getFullYear()}`;
    main.innerHTML = `<section class="board"><div class="scroll">${monthHTML()}</div></section>`;
  }
}

function dayHTML() {
  const ds = iso(cursor);
  const cols = S.members.filter(m => !hidden.has(m.id));
  const evs = eventsOn(ds);
  let h = `<div class="day-grid" style="--cols:${Math.max(cols.length, 1)}">`;
  h += `<div class="allday"><div class="lbl">hele dag</div>` + cols.map(m =>
    `<div class="cell">${evs.filter(e => e.allDay && e.members.includes(m.id)).map(e => `<button class="chip" data-eid="${e.id}" style="--c:${m.color}"><b>${esc(e.title)}</b></button>`).join('')}</div>`).join('') + `</div>`;
  h += `<div class="hours">` + Array.from({ length: HEND - HSTART }, (_, i) => `<div class="hour-lbl">${i ? HSTART + i + 'u' : ''}</div>`).join('') + `</div>`;
  const now = new Date(); const nowMin = now.getHours() * 60 + now.getMinutes();
  const showNow = ds === iso(now) && nowMin >= HSTART * 60;
  h += cols.map((m, ci) => {
    const list = evs.filter(e => !e.allDay && e.members.includes(m.id));
    const lanes = layout(list);
    return `<div class="col" style="height:${(HEND - HSTART) * 56}px">` + list.map(e => {
      const top = (toMin(e.start) - HSTART * 60) / 60 * 56;
      const hgt = Math.max(24, (Math.max(toMin(e.end), toMin(e.start) + 30) - toMin(e.start)) / 60 * 56 - 2);
      const L = lanes.get(e.id); const w = 100 / L.n;
      return `<button class="ev" data-eid="${e.id}" style="--c:${m.color};top:${top}px;height:${hgt}px;left:calc(${L.i * w}% + 3px);right:auto;width:calc(${w}% - 6px)"><b>${esc(e.title)}</b><small>${fmtRange(e)}</small></button>`;
    }).join('') + (showNow ? `<div class="nowline" style="top:${(nowMin - HSTART * 60) / 60 * 56}px"></div>${ci === 0 ? `<span class="nowtag" style="top:${(nowMin - HSTART * 60) / 60 * 56}px">${pad(now.getHours())}:${pad(now.getMinutes())}</span>` : ''}` : '') + `</div>`;
  }).join('');
  return h + `</div>`;
}
// eenvoudige kolomverdeling voor overlappende afspraken
function layout(list) {
  const res = new Map(); let group = [], end = -1, lanesEnd = [];
  const flush = () => { const n = lanesEnd.length || 1; group.forEach(id => res.get(id).n = n); group = []; lanesEnd = []; };
  [...list].sort((a, b) => toMin(a.start) - toMin(b.start)).forEach(e => {
    const s = toMin(e.start), f = Math.max(toMin(e.end), s + 30);
    if (s >= end) flush();
    let i = lanesEnd.findIndex(x => x <= s); if (i < 0) { i = lanesEnd.length; lanesEnd.push(f); } else lanesEnd[i] = f;
    res.set(e.id, { i, n: 1 }); group.push(e.id); end = Math.max(end, f);
  });
  flush(); return res;
}

const chipHTML = e => {
  const multi = e.members.length > 1;
  return `<button class="chip ${multi ? 'multi' : ''}" data-eid="${e.id}" style="--c:${colorOf(e)}"><b>${esc(e.title)}</b><small>${fmtRange(e)}</small>${multi ? `<span class="dots">${e.members.map(id => `<i style="--c:${member(id)?.color || '#999'}"></i>`).join('')}</span>` : ''}</button>`;
};
function weekHTML(ws) {
  const T = iso(new Date());
  return `<div class="week">` + Array.from({ length: 7 }, (_, i) => {
    const d = addDays(ws, i), ds = iso(d), evs = eventsOn(ds);
    return `<div class="wday ${ds === T ? 'is-today' : ''}"><div class="wday-h"><strong>${DSHORT[d.getDay()]} <span class="datebadge">${d.getDate()}</span></strong><span class="n">${evs.length ? evs.length + ' afspr.' : ''}</span></div>${evs.map(chipHTML).join('') || `<p class="empty-note">Een rustige dag.</p>`}</div>`;
  }).join('') + `</div>`;
}
function monthHTML() {
  const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const gs = startOfWeek(first); const T = iso(new Date());
  let h = `<div class="month">` + ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'].map(d => `<div class="mhead">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = addDays(gs, i), ds = iso(d), evs = eventsOn(ds);
    if (i === 35 && d.getMonth() !== cursor.getMonth()) break;
    h += `<button class="mcell ${d.getMonth() !== cursor.getMonth() ? 'out' : ''} ${ds === T ? 'is-today' : ''}" data-day="${ds}"><span class="mnum"><span class="datebadge">${d.getDate()}</span>${evs.length ? `<span class="c">${evs.length}</span>` : ''}</span>` +
      evs.slice(0, 3).map(e => `<span class="mchip ${e.members.length > 1 ? 'multi' : ''}" style="--c:${colorOf(e)}">${e.members.length > 1 ? '● ' : ''}${esc(e.title)}</span>`).join('') +
      (evs.length > 3 ? `<span class="more">+${evs.length - 3} meer</span>` : '') + `</button>`;
  }
  return h + `</div>`;
}

function panelsHTML(ds) {
  const wd = parseIso(ds).getDay(); const m = S.meals[wd] || {};
  const meals = ['ontbijt', 'lunch', 'diner'].map(k => `<div class="meal"><span class="k">${k}</span><span>${esc(m[k]) || '<span style="color:var(--muted)">—</span>'}</span></div>`).join('');
  const rows = S.members.map(mb => {
    const cs = S.chores.filter(c => c.memberId === mb.id); if (!cs.length) return '';
    const n = cs.filter(c => S.done[`${ds}|${c.id}`]).length;
    return `<div class="trow" style="--c:${mb.color}"><div class="who">${esc(mb.name)}<small>${n}/${cs.length}</small></div><div class="ticons">${cs.map(c => `<button class="tico" title="${esc(c.title)}" aria-label="${esc(c.title)}" data-chore="${c.id}" data-date="${ds}" aria-pressed="${!!S.done[`${ds}|${c.id}`]}">${c.icon}</button>`).join('')}</div></div>`;
  }).join('');
  return `<div class="panels"><section class="panel"><h2>Maaltijden vandaag <button data-goto="meals">Plannen</button></h2>${meals}</section><section class="panel"><h2>Taken vandaag <button data-goto="tasks">Alles</button></h2>${rows}</section></div>`;
}

function renderTasksPage() {
  const ds = iso(new Date());
  $('#main').innerHTML = `<section class="board"><div class="scroll"><div class="page">` + S.members.map(mb => {
    const cs = S.chores.filter(c => c.memberId === mb.id); const n = cs.filter(c => S.done[`${ds}|${c.id}`]).length;
    return `<div class="card" style="--c:${mb.color}"><h3><span class="avatar">${esc(mb.emoji)}</span>${esc(mb.name)}<small style="margin-left:auto;font-family:var(--f-body);font-size:13px;color:var(--muted)">${n}/${cs.length}</small></h3>
      <div class="bar"><i style="width:${cs.length ? n / cs.length * 100 : 0}%"></i></div>
      ${cs.map(c => { const d = !!S.done[`${ds}|${c.id}`]; return `<div class="task ${d ? 'done' : ''}"><button class="tico" data-chore="${c.id}" data-date="${ds}" aria-pressed="${d}" aria-label="${esc(c.title)} afvinken">${c.icon}</button><span>${esc(c.title)}</span><button class="x" data-delchore="${c.id}" aria-label="Taak verwijderen">×</button></div>`; }).join('')}
      <form class="addrow" data-addchore="${mb.id}"><input id="nt-${mb.id}" placeholder="Nieuwe taak, bv. 🧹 Vegen" aria-label="Nieuwe taak voor ${esc(mb.name)}"><button class="btn" type="submit">+</button></form></div>`;
  }).join('') + `</div></div></section>`;
}

function renderMealsPage() {
  const T = new Date().getDay();
  $('#main').innerHTML = `<section class="board"><div class="scroll"><div class="page">` + [1, 2, 3, 4, 5, 6, 0].map(wd => {
    const m = S.meals[wd] || {};
    return `<div class="card mealday ${wd === T ? 'today' : ''}"><h3>${DAYS[wd][0].toUpperCase() + DAYS[wd].slice(1)}${wd === T ? ' · vandaag' : ''}</h3>` +
      ['ontbijt', 'lunch', 'diner'].map(k => `<label for="ml-${wd}-${k}">${k}</label><input id="ml-${wd}-${k}" data-meal="${wd}" data-k="${k}" value="${esc(m[k])}">`).join('') + `</div>`;
  }).join('') + `</div></div></section>`;
}

// ---------- dialogen ----------
const layer = $('#layer');
function modal(html, onMount) {
  layer.innerHTML = `<div class="modal-back"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const back = layer.firstElementChild;
  back.addEventListener('click', e => { if (e.target === back || e.target.closest('[data-close]')) closeModal(); });
  onMount && onMount(back.firstElementChild);
  back.querySelector('input,button')?.focus();
}
const closeModal = () => { layer.innerHTML = ''; };

function editEvent(e, defaults = {}) {
  const isNew = !e;
  e = e || { id: uid(), title: '', date: iso(cursor), start: '17:00', end: '18:00', allDay: false, members: [], repeat: 'none', ...defaults };
  const sel = new Set(e.members);
  modal(`<h3>${isNew ? 'Nieuwe afspraak' : 'Afspraak'}<button data-close aria-label="Sluiten">×</button></h3>
    <label class="field"><span>Titel</span><input id="f-title" value="${esc(e.title)}" placeholder="bv. Volleybaltraining"></label>
    <div class="row2"><label class="field"><span>Datum</span><input id="f-date" type="date" value="${e.date}"></label>
    <label class="field"><span>Herhalen</span><select id="f-rep"><option value="none">Niet</option><option value="weekly" ${e.repeat === 'weekly' ? 'selected' : ''}>Elke week</option></select></label></div>
    <label class="check"><input type="checkbox" id="f-all" ${e.allDay ? 'checked' : ''}> Hele dag</label>
    <div class="row2" id="f-times" ${e.allDay ? 'hidden' : ''}><label class="field"><span>Van</span><input id="f-start" type="time" value="${e.start || '17:00'}"></label><label class="field"><span>Tot</span><input id="f-end" type="time" value="${e.end || '18:00'}"></label></div>
    <div class="field"><span>Voor wie</span><div class="picks">${S.members.map(m => `<button type="button" class="pick" data-pick="${m.id}" style="--c:${m.color}" aria-pressed="${sel.has(m.id)}">${esc(m.emoji)} ${esc(m.name)}</button>`).join('')}<button type="button" class="pick" data-pick="all" style="--c:var(--fg)" aria-pressed="false">Iedereen</button></div></div>
    <div class="actions">${isNew ? '' : '<button class="btn danger" id="f-del">Verwijderen</button>'}<button class="btn ghost" data-close>Annuleren</button><button class="btn" id="f-save">Bewaren</button></div>`, root => {
    root.querySelector('#f-all').onchange = ev => root.querySelector('#f-times').hidden = ev.target.checked;
    root.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
      if (b.dataset.pick === 'all') { const allOn = sel.size === S.members.length; S.members.forEach(m => allOn ? sel.delete(m.id) : sel.add(m.id)); }
      else sel.has(b.dataset.pick) ? sel.delete(b.dataset.pick) : sel.add(b.dataset.pick);
      root.querySelectorAll('[data-pick]').forEach(x => x.dataset.pick !== 'all' && x.setAttribute('aria-pressed', String(sel.has(x.dataset.pick))));
    });
    root.querySelector('#f-save').onclick = () => {
      const title = root.querySelector('#f-title').value.trim();
      if (!title) { root.querySelector('#f-title').focus(); toast('Geef de afspraak een titel'); return; }
      Object.assign(e, { title, date: root.querySelector('#f-date').value || iso(cursor), allDay: root.querySelector('#f-all').checked, start: root.querySelector('#f-start').value, end: root.querySelector('#f-end').value, repeat: root.querySelector('#f-rep').value, members: [...sel] });

}

async function ask(text) {
  $('#sugg') && ($('#sugg').hidden = true);
  convo.push({ role: 'user', text }); drawMsg(convo.at(-1));
  const local = understand(text);

    reply({ text: 'Dat begrijp ik nog niet. Probeer: “Zet tandarts op vrijdag om 10u voor Adam”, “Wat staat er morgen?” of “Wat eten we vanavond?”. Voor open vragen kan je een Claude API-sleutel toevoegen in Instellingen.' });
  }
}

// Nederlandstalige opdrachten herkennen zonder internet
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function findDate(t) {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  if (/\bovermorgen\b/.test(t)) return addDays(now, 2);
  if (/\bmorgen\b/.test(t)) return addDays(now, 1);
  if (/\b(vandaag|vanavond|vanmiddag|vanmorgen)\b/.test(t)) return now;
  let m = t.match(/\b(\d{1,2})\s*(januari|februari|maart|april|mei|juni|juli|augustus|september|oktober|november|december|jan|feb|mrt|apr|jun|jul|aug|sep|okt|nov|dec)\b/);
  if (m) { const mi = MONTHS.findIndex(x => x.startsWith(m[2].slice(0, 3))); let d = new Date(now.getFullYear(), mi, +m[1]); if (d < now) d.setFullYear(d.getFullYear() + 1); return d; }
  m = t.match(/\b(\d{1,2})[\/\-](\d{1,2})\b/);
  if (m) { let d = new Date(now.getFullYear(), +m[2] - 1, +m[1]); if (d < now) d.setFullYear(d.getFullYear() + 1); return d; }
  for (let i = 0; i < 7; i++) {
    const re = new RegExp(`\\b(volgende\\s+)?${DAYS[i]}\\b`); const mm = t.match(re);
    if (mm) { let diff = (i - now.getDay() + 7) % 7; if (mm[1] && diff === 0) diff = 7; else if (mm[1]) diff += diff < 7 ? 0 : 0; return addDays(now, diff); }
  }
  return null;
}
function findTimes(t) {
  const tm = s => { const m = s.match(/(\d{1,2})(?:[:.u h](\d{2}))?/); return m ? [+m[1], m[2] ? +m[2] : 0] : null; };
  let m = t.match(/\bvan\s+(\d{1,2}(?:[:.uh]\d{2})?)\s*(?:u|uur|h)?\s*(?:tot|-|tot en met)\s*(\d{1,2}(?:[:.uh]\d{2})?)\s*(?:u|uur|h)?/);
  let s, e;
  if (m) { s = tm(m[1]); e = tm(m[2]); }
  else { m = t.match(/\bom\s+(\d{1,2}(?:[:.uh]\d{2})?)\s*(u|uur|h|pm|am)?/); if (m) s = tm(m[1]); }
  if (!s) return null;
  const pmHint = /\b(avond|namiddag|middag|pm)\b/.test(t);
  if (s[0] < 8 && (pmHint || !/\b(ochtend|morgens|am)\b/.test(t))) s[0] += 12;
  if (e && e[0] < s[0] && e[0] + 12 <= 23) e[0] += 12;
  if (!e) e = [Math.min(23, s[0] + 1), s[1]];
  return { start: `${pad(s[0])}:${pad(s[1])}`, end: `${pad(e[0])}:${pad(e[1])}`, raw: m[0] };
}
function findMembers(t) {
  if (/\b(iedereen|het gezin|hele gezin|familie|allemaal|samen)\b/.test(t)) return S.members.map(m => m.id);
  const alias = { papa: ['papa', 'vader', 'pa', 'dad'], mama: ['mama', 'moeder', 'ma', 'mom'] };
  return S.members.filter(m => { const n = norm(m.name); return [n, ...(alias[n] || [])].some(a => new RegExp(`\\b${a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`).test(t)); }).map(m => m.id);
}
function listText(evs) {
  return evs.map(e => `${e.allDay ? 'hele dag' : fmtTime(e.start)}: ${e.title}`).join(', ');
}
function understand(raw) {
  const t = norm(raw);
  if (/wat kan je|wat kun je|help/.test(t)) return { html: 'Ik kan:<ul><li>afspraken toevoegen: “Zet zwemles op dinsdag om 17u voor Lina”</li><li>de agenda tonen: “Wat staat er morgen?”, “Wat is er dit weekend?”</li><li>maaltijden opzoeken: “Wat eten we vanavond?”</li><li>taken opvolgen: “Welke taken heeft Noah nog?”</li></ul>', say: 'Ik kan afspraken toevoegen, de agenda tonen, maaltijden opzoeken en taken opvolgen.' };
  // toevoegen
  if (/\b(zet|voeg|plan|maak|noteer|add|schrijf)\b/.test(t) && !/\b(taak|klusje)\b/.test(t)) {
    const d = findDate(t) || new Date(new Date().setHours(0, 0, 0, 0));
    const tm = findTimes(t); const mem = findMembers(t);
    let title = raw
      .replace(/^\s*(zet|voeg|plan|maak|noteer|schrijf|add)\b/i, '')
      .replace(/\b(toe|in de agenda|in de kalender|aan de kalender|aan de agenda|in)\b\s*$/i, '')
      .replace(/\b(volgende\s+)?(op\s+)?(maandag|dinsdag|woensdag|donderdag|vrijdag|zaterdag|zondag|vandaag|morgen|overmorgen|vanavond|vanmiddag)\b/gi, '')
      .replace(/\bop\s+\d{1,2}(\s*[a-z]+|[\/\-]\d{1,2})/gi, '')
      .replace(/\b(van\s+\d{1,2}([:.uh]\d{2})?\s*(u|uur|h)?\s*(tot|-)\s*\d{1,2}([:.uh]\d{2})?\s*(u|uur|h)?|om\s+\d{1,2}([:.uh]\d{2})?\s*(u|uur|h|pm|am)?)/gi, '')
      .replace(/\b(voor|met)\s+(iedereen|het gezin|de familie|familie|[\wÀ-ÿ]+(\s*(,|en)\s*[\wÀ-ÿ]+)*)\s*$/i, '')
      .replace(/\b(een|de|het)\b\s*/i, '')
      .replace(/\b(toe|in de agenda|in de kalender)\b/gi, '')
      .replace(/\s{2,}/g, ' ').replace(/^[\s,.-]+|[\s,.-]+$/g, '');
    if (!title) title = 'Afspraak';
    title = title[0].toUpperCase() + title.slice(1);
    const e = { id: uid(), title, date: iso(d), allDay: !tm, start: tm?.start || '', end: tm?.end || '', members: mem, repeat: /\belke week|wekelijks\b/.test(t) ? 'weekly' : 'none' };
    S.events.push(e); S.sample = false; save(); render();
    const who = mem.length ? mem.map(id => member(id).name).join(', ').replace(/, ([^,]*)$/, ' en $1') : 'het gezin';
    const txt = `${title} staat in de kalender op ${longDate(d)}${tm ? ' om ' + fmtTime(tm.start) : ''}, gedeeld met ${who}.`;
    return { text: txt, added: [e] };
  }
  // maaltijden
  if (/\b(eten|maaltijd|avondeten|diner|lunch|ontbijt|koken|kook)\b/.test(t)) {
    const d = findDate(t) || new Date(); const m = S.meals[d.getDay()] || {};
    const k = /ontbijt/.test(t) ? 'ontbijt' : /lunch|middag/.test(t) ? 'lunch' : /\b(avond|diner|koken|kook)\b/.test(t) ? 'diner' : null;
    const when = iso(d) === iso(new Date()) ? 'vandaag' : DAYS[d.getDay()];
    if (k) return { text: m[k] ? `${k[0].toUpperCase() + k.slice(1)} ${when}: ${m[k]}.` : `Er is nog geen ${k} gepland voor ${when}. Je kan het invullen bij Maaltijden.` };
    return { text: `Op het menu ${when}: ontbijt ${m.ontbijt || '—'}, lunch ${m.lunch || '—'}, diner ${m.diner || '—'}.` };
  }
  // taken
  if (/\b(taak|taken|klusje|klusjes|chores)\b/.test(t)) {
    const ds = iso(new Date()); const mem = findMembers(t); const ids = mem.length ? mem : S.members.map(m => m.id);
    const parts = ids.map(id => { const open = S.chores.filter(c => c.memberId === id && !S.done[`${ds}|${c.id}`]); return `${member(id).name}: ${open.length ? open.map(c => c.title.toLowerCase()).join(', ') : 'alles gedaan 🎉'}`; });
    return { html: `<b>Open taken vandaag</b><ul>${parts.map(p => `<li>${esc(p)}</li>`).join('')}</ul>`, say: parts.join('. ') };
  }
  // agenda opvragen
  if (/\b(wat|wie|welke|agenda|planning|staat|gepland|is er)\b/.test(t)) {
    const mem = findMembers(t);
    const filt = evs => mem.length ? evs.filter(e => e.members.some(id => mem.includes(id))) : evs;
    if (/\b(weekend)\b/.test(t)) {
      const now = new Date(); now.setHours(0, 0, 0, 0); const sat = addDays(now, (6 - now.getDay() + 7) % 7); const sun = addDays(sat, 1);
      const a = filt(eventsOn(iso(sat), { filter: false })), b = filt(eventsOn(iso(sun), { filter: false }));
      return { html: `<b>Dit weekend</b><ul><li>Zaterdag: ${esc(listText(a) || 'niets gepland')}</li><li>Zondag: ${esc(listText(b) || 'niets gepland')}</li></ul>`, say: `Zaterdag: ${listText(a) || 'niets gepland'}. Zondag: ${listText(b) || 'niets gepland'}.` };
    }
    if (/\b(deze week|week)\b/.test(t)) {
      const ws = startOfWeek(new Date()); const items = Array.from({ length: 7 }, (_, i) => { const d = addDays(ws, i); const l = filt(eventsOn(iso(d), { filter: false })); return l.length ? `${DAYS[d.getDay()]}: ${listText(l)}` : null; }).filter(Boolean);
      return { html: `<b>Deze week</b><ul>${items.map(x => `<li>${esc(x)}</li>`).join('') || '<li>Niets gepland</li>'}</ul>`, say: items.join('. ') || 'Niets gepland deze week.' };
    }
    const d = findDate(t) || new Date(); const l = filt(eventsOn(iso(d), { filter: false }));
    const when = iso(d) === iso(new Date()) ? 'Vandaag' : longDate(d).replace(/^./, c => c.toUpperCase());
    return { html: `<b>${esc(when)}</b>${l.length ? `<ul>${l.map(e => `<li>${esc((e.allDay ? 'hele dag' : fmtRange(e)) + ' · ' + e.title)}${e.members.length ? ' <span style="color:var(--muted)">(' + esc(e.members.map(id => member(id)?.name).join(', ')) + ')</span>' : ''}</li>`).join('')}</ul>` : '<br>Niets gepland. Een rustige dag.'}`, say: l.length ? `${when}: ${listText(l)}.` : `${when} staat er niets gepland.` };
  }
  return null;
}

async function askClaude(text) {
  const today = new Date(); const ctx = [];
  for (let i = -1; i < 14; i++) { const d = addDays(today, i); const l = eventsOn(iso(d), { filter: false }); if (l.length) ctx.push(`${iso(d)} (${DAYS[d.getDay()]}): ` + l.map(e => `${e.title} ${e.allDay ? 'hele dag' : e.start + '-' + e.end} [${e.members.map(id => member(id)?.name).join(', ')}]`).join('; ')); }
  const system = `Je bent de vriendelijke gezinsassistent op een keukenscherm. Antwoord kort in het Nederlands (Vlaams mag). Vandaag is ${longDate(today)} ${iso(today)}.
Gezinsleden: ${S.members.map(m => m.name).join(', ')}.
Agenda komende dagen:\n${ctx.join('\n') || '(leeg)'}
Maaltijdplan per weekdag: ${JSON.stringify(S.meals)}.
Antwoord ALTIJD met enkel JSON: {"reply": "tekst", "add_events": [{"title": "...", "date": "YYYY-MM-DD", "start": "HH:MM", "end": "HH:MM", "allDay": false, "members": ["naam"]}]}. Laat add_events leeg tenzij de gebruiker vraagt iets in te plannen.`;
  const history = convo.slice(-9, -1).map(m => ({ role: m.role, content: m.text || m.say || '' })).filter(m => m.content);
  while (history.length && history[0].role !== 'user') history.shift();
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': S.settings.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: S.settings.model || 'claude-sonnet-5-5', max_tokens: 800, system, messages: [...history, { role: 'user', content: text }] }),
  });
  if (!res.ok) throw new Error('fout ' + res.status);
  const data = await res.json();
  const out = (data.content || []).map(c => c.text || '').join('');
  let j; try { j = JSON.parse(out.slice(out.indexOf('{'), out.lastIndexOf('}') + 1)); } catch { return { text: out }; }
  const added = (j.add_events || []).map(a => ({ id: uid(), title: a.title || 'Afspraak', date: a.date || iso(today), allDay: !!a.allDay || !a.start, start: a.start || '', end: a.end || '', repeat: 'none', members: (a.members || []).map(n => S.members.find(m => norm(m.name) === norm(n))?.id).filter(Boolean) }));
  if (added.length) { S.events.push(...added); save(); render(); }
  return { text: j.reply || 'Klaar.', added };
}

// spraak
let rec = null;
function toggleListen() { rec ? stopListen() : startListen(); }
function startListen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Spraak wordt in deze browser niet ondersteund. Typ je vraag.'); return; }
  try {
    rec = new SR(); rec.lang = 'nl-BE'; rec.interimResults = true;
    const btn = $('#talk'); btn.classList.add('on'); btn.textContent = '■ Stop';
    rec.onresult = e => { const r = [...e.results].map(x => x[0].transcript).join(''); $('#ask').value = r; if (e.results[e.results.length - 1].isFinal) { $('#ask').value = ''; stopListen(); ask(r); } };
    rec.onerror = ev => { stopListen(); if (ev.error === 'not-allowed') toast('Geef toegang tot de microfoon om te praten.'); };
    rec.onend = () => stopListen();
    rec.start();
  } catch { stopListen(); toast('De microfoon kon niet starten.'); }
}
function stopListen() {
  if (rec) { try { rec.onend = null; rec.stop(); } catch {} rec = null; }
  const b = $('#talk'); if (b) { b.classList.remove('on'); b.textContent = '🎙 Praat'; }
}

document.addEventListener('click', e => {
  const t = e.target;
  const tb = t.closest('.tabs button'); if (tb) { tab = tb.dataset.tab; render(); return; }
  const go = t.closest('[data-goto]'); if (go) { tab = go.dataset.goto; render(); return; }
  const vb = t.closest('.seg button'); if (vb) { S.settings.view = vb.dataset.view; save(); render(); return; }
  const p = t.closest('.person'); if (p) { const id = p.dataset.mid; hidden.has(id) ? hidden.delete(id) : hidden.add(id); render(); return; }
  const ch = t.closest('[data-chore]'); if (ch) { const k = `${ch.dataset.date}|${ch.dataset.chore}`; S.done[k] ? delete S.done[k] : (S.done[k] = true); save(); render(); return; }
  const dc = t.closest('[data-delchore]'); if (dc) { S.chores = S.chores.filter(c => c.id !== dc.dataset.delchore); save(); render(); return; }
  if (t.closest('#layer')) return;
  const ev = t.closest('[data-eid]'); if (ev) { editEvent(S.events.find(x => x.id === ev.dataset.eid)); return; }
  const dy = t.closest('[data-day]'); if (dy) { dayPopup(dy.dataset.day); return; }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-addchore]'); if (!f) return; e.preventDefault();
  const v = f.querySelector('input').value.trim(); if (!v) return;
  const m = v.match(/^(\p{Extended_Pictographic}️?)\s*(.*)$/u);
  S.chores.push({ id: uid(), memberId: f.dataset.addchore, icon: m ? m[1] : '✅', title: m ? (m[2] || 'Taak') : v });
  save(); render(); toast('Taak toegevoegd');
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset.meal) return;
  S.meals[t.dataset.meal] = S.meals[t.dataset.meal] || {}; S.meals[t.dataset.meal][t.dataset.k] = t.value; save(); toast('Maaltijd bewaard');
});
$('#prev').onclick = () => step(-1); $('#next').onclick = () => step(1);
$('#todayBtn').onclick = () => { cursor = new Date(); cursor.setHours(0, 0, 0, 0); render(); };
function step(n) { const v = S.settings.view; cursor = v === 'D' ? addDays(cursor, n) : v === 'W' ? addDays(cursor, 7 * n) : new Date(cursor.getFullYear(), cursor.getMonth() + n, 1); render(); }
$('#fab').onclick = () => editEvent(null, { date: iso(cursor) });
$('#settingsBtn').onclick = settings;
$('#mascotBtn').onclick = openAssist;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (document.querySelector('.assist')) closeAssist(); else closeModal(); } });

function tick() {
  const d = new Date();
  $('#clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())} · ${DSHORT[d.getDay()]} ${d.getDate()} ${MSHORT[d.getMonth()]}${S.sample ? ' · voorbeeldgezin' : ''}`;
}
tick(); setInterval(() => { tick(); if (tab === 'cal' && S.settings.view === 'D' && !layer.innerHTML) render(); }, 60000);
// scherm wakker houden op een keukenscherm
try { navigator.wakeLock?.request('screen').catch(() => {}); } catch {}
render();
})();
</script>
</body>
