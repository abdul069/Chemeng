name: Docker-image
# Bouwt de container op GitHub en zet hem in de GitHub Container Registry (ghcr.io).
# Railway (of elke andere host) start dan een kant-en-klare image en hoeft zelf niets te bouwen.
# Na de build vraagt de workflow Railway om te herstarten (stap "Railway herdeployen").
on:
  push:
    branches: ["**"]
    paths-ignore: ["*.md", "docs/**", ".github/workflows/android.yml", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image bouwen en publiceren
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kinday:latest
            ghcr.io/${{ github.repository_owner }}/kinday:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Railway meteen laten herstarten op de nieuwe image. Werkt zodra het secret RAILWAY_TOKEN bestaat
      # (project-token uit Railway → Project Settings → Tokens). Omgeving en service worden via het token opgezocht;
      # de servicenaam is "gezinsbord" tenzij RAILWAY_SERVICE_NAME anders zegt.
      - name: Railway herdeployen
        if: ${{ env.RAILWAY_TOKEN != '' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME || 'gezinsbord' }}
        run: |
          gql() { jq -n --arg q "$1" '{query:$q}' | curl -sS -X POST https://backboard.railway.com/graphql/v2 -H "content-type: application/json" -H "Project-Access-Token: $RAILWAY_TOKEN" -d @-; }
          info=$(gql '{ projectToken { projectId environmentId } }'); echo "$info"
          project=$(echo "$info" | jq -r '.data.projectToken.projectId // empty'); env_id=$(echo "$info" | jq -r '.data.projectToken.environmentId // empty')
          [ -n "$project" ] || { echo "Token geeft geen project terug"; exit 1; }
          services=$(gql "{ project(id: \"$project\") { services { edges { node { id name } } } } }"); echo "$services"
          service=$(echo "$services" | jq -r --arg n "$SERVICE_NAME" '.data.project.services.edges[] | select(.node.name==$n) | .node.id')
          [ -n "$service" ] || { echo "Service $SERVICE_NAME niet gevonden"; exit 1; }
          out=$(gql "mutation { serviceInstanceRedeploy(environmentId: \"$env_id\", serviceId: \"$service\") }"); echo "$out"
          echo "$out" | grep -q '"errors"' && exit 1 || echo "Railway herstart $SERVICE_NAME met de nieuwe image."
