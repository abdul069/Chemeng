name: Android-app
on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # De ubuntu-runner heeft de Android SDK al (ANDROID_HOME); ontbrekende platforms downloadt Gradle zelf.
      - name: SDK-licenties accepteren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - name: Webbundel en Capacitor-sync
        working-directory: web
        run: |
          npm run build
          npx cap sync android
      - name: APK bouwen (debug, direct installeerbaar)
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Ondertekende release-APK (alleen als de keystore-secrets bestaan)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: web/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          # App Bundle voor de Play Store (zelfde keystore)
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: APK's verzamelen
        run: |
          mkdir -p out
          cp web/android/app/build/outputs/apk/debug/app-debug.apk out/gezinsbord-debug.apk
          [ -f web/android/app/build/outputs/apk/release/app-release.apk ] && cp web/android/app/build/outputs/apk/release/app-release.apk out/kinday-release.apk || true
          [ -f web/android/app/build/outputs/bundle/release/app-release.aab ] && cp web/android/app/build/outputs/bundle/release/app-release.aab out/kinday-playstore.aab || true
          # QR-provisionering van een kindertablet: checksum van de ondertekende APK (base64url, zonder =)
          if [ -f out/kinday-release.apk ]; then
            sum=$(sha256sum out/kinday-release.apk | cut -d' ' -f1 | xxd -r -p | base64 -w0 | tr '+/' '-_' | tr -d '=')
            cat > out/provisioning.json <<JSON
          {"android.app.extra.PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME":"be.gezinsbord.app/be.gezinsbord.app.KioskAdminReceiver","android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_DOWNLOAD_LOCATION":"https://github.com/${{ github.repository }}/releases/download/android-latest/kinday-release.apk","android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_CHECKSUM":"$sum","android.app.extra.PROVISIONING_SKIP_ENCRYPTION":true,"android.app.extra.PROVISIONING_LEAVE_ALL_SYSTEM_APPS_ENABLED":true,"android.app.extra.PROVISIONING_KEEP_SCREEN_ON":true}
          JSON
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gezinsbord-apk
          path: |
            out/*.apk
            out/*.aab
            out/provisioning.json
      - name: Vaste downloadlink bijwerken (release "android-latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Kinday Android-app (laatste build)
          body: "Download gezinsbord-debug.apk, open het bestand op je telefoon en sta installatie uit onbekende bronnen toe. De app laadt de live Kinday-server. Met keystore-secrets staan hier ook de ondertekende APK en de Play Store-bundle (.aab)."
          prerelease: true
          files: |
            out/*.apk
            out/*.aab
            out/provisioning.json
