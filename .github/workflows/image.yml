name: Docker-image
# Bouwt de container op GitHub en zet hem in de GitHub Container Registry (ghcr.io).
# Railway (of elke andere host) start dan een kant-en-klare image en hoeft zelf niets te bouwen.
on:
  push:
    branches: ["**"]
    paths-ignore: ["*.md", "docs/**", ".github/workflows/android.yml", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image bouwen en publiceren
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kinday:latest
            ghcr.io/${{ github.repository_owner }}/kinday:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Railway meteen laten herstarten op de nieuwe image. Werkt zodra deze drie secrets bestaan:
      # RAILWAY_TOKEN (project-token), RAILWAY_SERVICE_ID en RAILWAY_ENVIRONMENT_ID (uit de URL van de service in Railway).
      - name: Railway herdeployen
        if: ${{ env.RAILWAY_TOKEN != '' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          body=$(printf '{"query":"mutation { serviceInstanceRedeploy(environmentId: \\"%s\\", serviceId: \\"%s\\") }"}' "$ENVIRONMENT_ID" "$SERVICE_ID")
          out=$(curl -sS -X POST https://backboard.railway.com/graphql/v2 -H "content-type: application/json" -H "Project-Access-Token: $RAILWAY_TOKEN" -d "$body")
          echo "$out"
          echo "$out" | grep -q '"errors"' && exit 1 || echo "Railway herstart de service met de nieuwe image."
